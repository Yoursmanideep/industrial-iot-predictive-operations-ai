  FRN-FLW:
    category: PROCESS
    name: Furnace Fuel Flow Abnormality
    primary_signals:
      - fuel_flow_rate
  FRN-PRS:
    category: PRESSURE
    name: Furnace Pressure Abnormality
    primary_signals:
      - pressure_mbar

  INS-CAL:
    category: CONTROL
