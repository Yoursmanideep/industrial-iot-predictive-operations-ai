[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-iot-simulator"
version = "0.1.0"
description = "Deterministic synthetic industrial IoT simulator for Apex Industrial Manufacturing."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.23"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]

[project.scripts]
industrial-sim = "industrial_sim.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
