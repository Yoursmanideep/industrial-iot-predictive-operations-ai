failure_taxonomy:
  severity_levels:
    - INFO
    - LOW
    - MEDIUM
    - HIGH
    - CRITICAL

  categories:
    MECHANICAL:
      description: Mechanical degradation, wear, imbalance or bearing-related faults.
      examples:
        - Bearing degradation
        - Spindle imbalance
        - Joint wear
        - Belt degradation

    THERMAL:
      description: Abnormal temperature behavior or overheating.
      examples:
        - Motor overheating
        - Bearing overheating
        - Furnace temperature instability

    PRESSURE:
      description: Pressure outside the expected operating envelope.
      examples:
        - Hydraulic pressure leak
        - Compressor pressure instability
        - Low process pressure

    ELECTRICAL:
      description: Electrical load or power-consumption abnormalities.
      examples:
        - Motor overload
        - Abnormal power draw
        - Current spike

    PROCESS:
      description: Process degradation causing production or quality impact.
      examples:
        - Production slowdown
        - Cycle-time degradation
        - Quality deterioration

    CONTROL:
      description: Controls, communication or positioning problems.
      examples:
        - Position deviation
        - Sensor communication loss
        - Calibration drift

    ENVIRONMENTAL:
      description: External environmental effects influencing machine behavior.
      examples:
        - Ambient temperature stress
        - Humidity-related impact

failure_modes:
  CNC-BRG:
    category: MECHANICAL
    name: Spindle Bearing Degradation
    primary_signals:
      - vibration_mm_s
      - temperature_c
      - power_kw
  CNC-OVH:
    category: THERMAL
    name: CNC Overheating
    primary_signals:
      - temperature_c
      - power_kw
  CNC-TOOL:
    category: PROCESS
    name: Cutting Tool Wear
    primary_signals:
      - vibration_mm_s
      - production_rate_unit_min
      - quality_score_pct
  CNC-IMB:
    category: MECHANICAL
    name: Spindle Imbalance
    primary_signals:
