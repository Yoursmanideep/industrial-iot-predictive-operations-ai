      - force_kn
  HPR-OVH:
    category: THERMAL
    name: Hydraulic Overheating
    primary_signals:
      - temperature_c
      - hydraulic_pressure_bar
  HPR-ACT:
    category: MECHANICAL
    name: Actuator Degradation
    primary_signals:
