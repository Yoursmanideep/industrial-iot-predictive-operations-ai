line_execution:
  machine_selection: one_machine_per_route_step
  bottleneck_rule: minimum_available_capacity
  scenario_multiplier_applied: true
  blocked_or_starved_machine_capacity_factor: 0.0
  setup_capacity_factor: 0.55
  recovery_capacity_factor: 0.25
  minimum_active_rate_units_min: 0.01

losses:
  slowdown_threshold_ratio: 0.85
  downtime_threshold_ratio: 0.10
  default_loss_reasons:
    slowdown: SLOW_CYCLE
    downtime: MACHINE_DOWNTIME
    quality: QUALITY_DEFECT