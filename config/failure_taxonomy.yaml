      - cycle_time_s

  ROB-JNT:
    category: MECHANICAL
    name: Robot Joint Degradation
    primary_signals:
      - torque_nm
      - vibration_mm_s
  ROB-MTR:
    category: THERMAL
    name: Robot Motor Overheating
    primary_signals:
      - motor_temperature_c
      - power_kw
  ROB-POS:
    category: CONTROL
    name: Robot Position Deviation
